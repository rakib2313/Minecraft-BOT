name: Minecraft AFK Bot 24/7

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # প্রতি ৫ ঘণ্টায় একবার (৬ ঘণ্টার run শেষ হওয়ার আগে overlap কমাতে)
    - cron: '0 */5 * * *'

# সবচেয়ে গুরুত্বপূর্ণ: একসাথে শুধু ১টা run চলবে
# নতুন run এলে পুরনো run বন্ধ হয়ে যাবে
concurrency:
  group: minecraft-single-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run AFK Bot
        env:
          # ফিক্সড নাম — র‍্যান্ডম নয় (Secrets এ MC_USERNAME সেট করুন)
          MC_USERNAME: ${{ secrets.MC_USERNAME }}
        run: |
          echo "Starting single Minecraft bot..."
          node bot.js &
          BOT_PID=$!

          RUNTIME=21000
          ELAPSED=0

          while [ $ELAPSED -lt $RUNTIME ]; do
            if ! kill -0 $BOT_PID 2>/dev/null; then
              echo "Bot process died, restarting same bot..."
              node bot.js &
              BOT_PID=$!
            fi
            sleep 60
            ELAPSED=$((ELAPSED + 60))
            echo "Runtime: $((ELAPSED / 60)) min / $((RUNTIME / 60)) min"
          done
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: pkill -f "node bot.js" || true
