name: Minecraft 24/7 Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Bot
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            try {
              // বটটিকে ২৫ মিনিট একটানা চালিয়ে প্রসেস ক্লোজ করবে
              execSync('node bot.js', { timeout: 1500000, stdio: 'inherit' });
            } catch (e) {
              console.log('Bot session ended or timeout reached, which is normal.');
            }
